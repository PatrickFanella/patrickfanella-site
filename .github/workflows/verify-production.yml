name: Verify production
run-name: Production verification ${{ inputs.source_revision }}

'on':
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact source commit expected at the public origin
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ inputs.source_revision }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check every legacy route and the exact public build
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
        run: npm run check:live -- https://patrickfanella.co --revision="$SOURCE_REVISION"
      - name: Audit the public site with mobile Lighthouse
        run: node scripts/lighthouse.mjs https://patrickfanella.co
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: production-lighthouse-reports
          path: test-results/lighthouse/
          if-no-files-found: ignore
          retention-days: 30
