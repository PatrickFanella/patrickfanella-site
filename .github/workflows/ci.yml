name: CI
run-name: CI ${{ github.sha }}

'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Record Clpr and build static evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Install recording browser
        run: npx playwright install --with-deps chromium
      - name: Record the visitor worker and build its static evidence
        run: npm run record:clpr
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recorded-site
          path: |
            dist/
            src/desk/inspector/recorded-run.json
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build and test in Chromium
    needs: record
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: recorded-site
          path: .
      - name: Check the recorded data and types
        run: node scripts/check-clpr-recording.mjs --built && npm run typecheck
      - name: Check project route coverage
        run: node scripts/check-project-paths.mjs
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Browser tests
        run: npx playwright test
      - name: Mobile Lighthouse launch budgets
        run: npm run lighthouse:ci
      - name: Check isolated edge-route replacement and rollback
        run: python3 deploy/test_edge_route.py
      - name: Check lazy assets survive production release switches
        run: python3 deploy/test_release_assets.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lighthouse-reports
          path: test-results/lighthouse/
          if-no-files-found: ignore
          retention-days: 14

  # Both origins read this tested artifact: production at patrickfanella.co and the
  # private preview behind Authelia. The branch holds one commit, replaced on each deploy.
  deploy:
    name: Publish the tested static build
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: deploy-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: recorded-site
          path: .
      - name: Push the build to the deploy branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SHA" > dist/REVISION
          cd dist
          git init -q -b deploy
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "Build of main $SHA"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" push -qf "https://github.com/$REPO.git" deploy
